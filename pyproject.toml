[tool.ruff]
# Cấu hình Ruff - linter Python nhanh, thay thế flake8/isort/black
line-length = 100
target-version = "py39"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (sắp xếp import)
    "B",   # flake8-bugbear (bắt lỗi phổ biến)
    "UP",  # pyupgrade (cú pháp hiện đại)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
